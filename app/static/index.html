<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CeCe | Compassionate Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        #chat-output {
            height: 65vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #e5e7eb transparent;
        }
        #chat-output::-webkit-scrollbar { width: 4px; }
        #chat-output::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }

        .user-bubble {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border-radius: 1.25rem 1.25rem 0.25rem 1.25rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }
        
        .ai-bubble {
            background-color: #f3f4f6;
            color: #1f2937;
            border-radius: 1.25rem 1.25rem 1.25rem 0.25rem;
        }

        .doctor-card {
            background: white;
            border-radius: 1rem;
            padding: 1.25rem;
            box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .doctor-card:hover {
            transform: translateY(-2px);
            box-shadow: 4px 8px 20px rgba(99, 102, 241, 0.15);
            border-color: #e0e7ff;
        }

        .doctor-card.selected {
            border-color: #6366f1;
            box-shadow: 4px 8px 24px rgba(99, 102, 241, 0.25);
        }

        .time-slot {
            padding: 0.75rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-weight: 500;
        }

        .time-slot:hover:not(.unavailable) {
            border-color: #818cf8;
            background: #eef2ff;
        }

        .time-slot.selected {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .typing-dot {
            width: 4px;
            height: 4px;
            background: #6366f1;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .slide-left {
            animation: slideLeft 0.4s ease-out;
        }
        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .slide-right {
            animation: slideRight 0.4s ease-out;
        }
        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Modern Calendar Styles */
        .calendar-container {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calendar-day:not(.disabled):hover {
            background: #eef2ff;
        }

        .calendar-day.selected {
            background: #6366f1;
            color: white;
        }

        .calendar-day.disabled {
            color: #cbd5e1;
            cursor: not-allowed;
        }

        .calendar-day.today {
            border: 2px solid #6366f1;
        }

        .input-error {
            border-color: #ef4444 !important;
        }

        .error-text {
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white shadow-2xl rounded-3xl overflow-hidden flex flex-col h-[90vh] border border-slate-100">
        
        <header class="px-6 py-5 bg-white border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center">
                    <span class="text-indigo-600 font-semibold text-lg">C</span>
                </div>
                <div>
                    <h1 class="text-lg font-semibold text-slate-800 leading-tight">CeCe</h1>
                    <div class="flex items-center space-x-1.5">
                        <div id="online-indicator" class="w-2 h-2 bg-slate-300 rounded-full"></div>
                        <span id="connection-text" class="text-xs text-slate-400 font-medium">Connecting...</span>
                    </div>
                </div>
            </div>
            <a href="/assessment" class="text-sm font-semibold text-indigo-700 hover:text-indigo-900">Check-in form</a>
        </header>

        <main id="chat-output" class="flex-grow p-6 space-y-6 bg-white">
            <div class="ai-bubble max-w-[85%] p-4 shadow-sm text-sm leading-relaxed fade-in">
                Hi there. I'm CeCe, your AI support assistant powered by the Corner Health Center. How can I help you today?
                By chatting with me you agree to our <a href = 'https://cornerhealth.org/contact-us/privacy-patient-rights/' class='underline hover:no-underline'>privacy policy</a>
            </div>
        </main>

        <footer class="p-6 bg-white border-t border-slate-50">
            <div id="loading-indicator" class="hidden mb-4 ml-2 fade-in">
                <div class="flex items-center space-x-1">
                    <span class="text-xs text-slate-400 mr-1 italic">CeCe is thinking</span>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
            
            <div id="interrupt-area" class="hidden p-4 mb-4 bg-indigo-50 rounded-2xl border border-indigo-100 fade-in">
                <p class="text-xs font-semibold text-indigo-700 uppercase tracking-wider mb-2">Required Information</p>
                <p class="text-sm text-indigo-900 mb-3" id="interrupt-request"></p>
                <div class="space-y-2" id="generic-interrupt-controls">
                    <input type="text" id="interrupt-input" 
                           class="w-full p-2.5 bg-white border border-indigo-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <p class="error-text hidden" id="interrupt-error"></p>
                    <button onclick="handleResume()" 
                            class="w-full px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-xl hover:bg-indigo-700 transition shadow-sm">
                        Submit
                    </button>
                </div>
                <form id="contact-interrupt-controls" class="hidden space-y-3" onsubmit="handleContactDetails(event)">
                    <div>
                        <label for="contact-full-name" class="block text-xs font-semibold text-slate-700 mb-1">Full name</label>
                        <input id="contact-full-name" autocomplete="name" class="w-full p-2.5 bg-white border border-indigo-200 rounded-lg text-sm" placeholder="First and last name">
                    </div>
                    <div>
                        <label for="contact-phone" class="block text-xs font-semibold text-slate-700 mb-1">Phone number</label>
                        <input id="contact-phone" type="tel" autocomplete="tel" class="w-full p-2.5 bg-white border border-indigo-200 rounded-lg text-sm" placeholder="+1 734 555 0123">
                        <p class="mt-1 text-xs text-slate-500">Include the country code. Example: +1 734 555 0123</p>
                    </div>
                    <div>
                        <label for="contact-email" class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
                        <input id="contact-email" type="email" autocomplete="email" class="w-full p-2.5 bg-white border border-indigo-200 rounded-lg text-sm" placeholder="name@example.com">
                    </div>
                    <label class="flex items-start gap-2 text-xs text-slate-700">
                        <input id="contact-consent" type="checkbox" class="mt-0.5">
                        <span>I agree to receive appointment reminders by text message or phone call.</span>
                    </label>
                    <p class="error-text hidden" id="contact-error"></p>
                    <button type="submit" class="w-full px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition">Continue</button>
                </form>
                <div id="safety-interrupt-controls" class="hidden space-y-2">
                    <button type="button" onclick="resumeSafetyGuidance(true)" class="w-full px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition">I understand, continue booking</button>
                    <button type="button" onclick="resumeSafetyGuidance(false)" class="w-full px-4 py-2 border border-indigo-300 text-indigo-800 text-sm font-medium rounded-lg hover:bg-white transition">Stop booking</button>
                </div>
            </div>

            <div id="main-input-area" class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-2xl">
                <input type="text" id="user-input" placeholder="Message CeCe..." 
                       class="flex-grow bg-transparent p-3 text-sm focus:outline-none"
                       onkeydown="if(event.key === 'Enter') sendMessage()">
                <button id="send-button" onclick="sendMessage()" 
                        class="p-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition shadow-lg disabled:opacity-50 disabled:shadow-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        const isSecure = window.location.protocol.startsWith('https');
        const protocol = isSecure ? 'wss' : 'ws';
        const WS_URL = `${protocol}://${window.location.host}/ws/chat`; 
        
        const chatOutput = document.getElementById('chat-output');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const onlineIndicator = document.getElementById('online-indicator');
        const connectionText = document.getElementById('connection-text');
        const loadingIndicator = document.getElementById('loading-indicator');
        const interruptArea = document.getElementById('interrupt-area');
        const interruptRequest = document.getElementById('interrupt-request');
        const interruptInput = document.getElementById('interrupt-input');
        const interruptError = document.getElementById('interrupt-error');
        const genericInterruptControls = document.getElementById('generic-interrupt-controls');
        const contactInterruptControls = document.getElementById('contact-interrupt-controls');
        const safetyInterruptControls = document.getElementById('safety-interrupt-controls');
        
        let ws = null;
        let waitingForResume = false;
        let requiredFieldType = null;
        let hospitalId = null;
        
        // Booking state
        let bookingState = {
            selectedDoctor: null,
            selectedDate: null,
            selectedSlot: null,
            patientName: '',
            patientEmail: '',
            patientPhone: ''
        };

        // Validation functions
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validatePhone(phone) {
            const normalized = normalizePhone(phone);
            return /^\+[1-9]\d{7,14}$/.test(normalized);
        }

        function normalizePhone(phone) {
            let normalized = phone.replace(/[^\d+]/g, '');
            if (normalized.startsWith('00')) normalized = `+${normalized.slice(2)}`;
            return normalized;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[character]);
        }

        function safeImageUrl(value) {
            try {
                const parsed = new URL(value, window.location.origin);
                return parsed.protocol === 'https:' ? parsed.href : '';
            } catch (_) {
                return '';
            }
        }

        function scrollToBottom() { 
            chatOutput.scrollTop = chatOutput.scrollHeight; 
        }

        function setStatus(connected) {
            if (connected) {
                onlineIndicator.classList.replace('bg-slate-300', 'bg-emerald-500');
                connectionText.textContent = "Online";
                connectionText.classList.replace('text-slate-400', 'text-emerald-500');
            } else {
                onlineIndicator.classList.replace('bg-emerald-500', 'bg-slate-300');
                connectionText.textContent = "Reconnecting...";
                connectionText.classList.replace('text-emerald-500', 'text-slate-400');
            }
        }

        function appendMessage(content, sender) {
            const container = document.createElement('div');
            container.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} fade-in`;
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] p-4 text-sm leading-relaxed whitespace-pre-wrap ${sender === 'user' ? 'user-bubble' : 'ai-bubble'}`;
            bubble.textContent = content;
            container.appendChild(bubble);
            chatOutput.appendChild(container);
            scrollToBottom();
        }

        function appendAssessmentAction(url) {
            document.getElementById('assessment-action')?.remove();
            const container = document.createElement('div');
            container.id = 'assessment-action';
            container.className = 'flex justify-start fade-in';
            const link = document.createElement('a');
            link.href = url;
            link.className = 'inline-flex items-center rounded-lg bg-emerald-700 px-4 py-3 text-sm font-semibold text-white hover:bg-emerald-800';
            link.textContent = 'Open mental health check-in';
            container.appendChild(link);
            chatOutput.appendChild(container);
            scrollToBottom();
        }

        function appendSuggestions(suggestions) {
            document.getElementById('response-suggestions')?.remove();
            if (!Array.isArray(suggestions) || suggestions.length === 0) return;
            const container = document.createElement('div');
            container.id = 'response-suggestions';
            container.className = 'flex flex-wrap gap-2 fade-in';
            suggestions.forEach(suggestion => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'rounded-lg border border-indigo-300 bg-white px-3 py-2 text-left text-sm font-semibold text-indigo-800 hover:bg-indigo-50';
                button.textContent = suggestion;
                button.addEventListener('click', () => {
                    userInput.value = suggestion;
                    container.remove();
                    sendMessage();
                });
                container.appendChild(button);
            });
            chatOutput.appendChild(container);
            scrollToBottom();
        }

        function appendEmergencyContacts(contacts) {
            document.getElementById('emergency-contacts')?.remove();
            if (!Array.isArray(contacts) || contacts.length === 0) return;
            const container = document.createElement('div');
            container.id = 'emergency-contacts';
            container.className = 'grid gap-2 rounded-lg border-2 border-red-300 bg-red-50 p-3 fade-in';
            contacts.forEach(contact => {
                const phone = String(contact.phone || '').replace(/[^\d+]/g, '');
                if (!phone) return;
                const link = document.createElement('a');
                link.href = `tel:${phone}`;
                link.className = 'rounded-lg bg-white px-3 py-2 text-sm font-semibold text-red-800 border border-red-200 hover:bg-red-100';
                link.textContent = `${contact.label}: ${contact.phone}`;
                container.appendChild(link);
            });
            chatOutput.appendChild(container);
            scrollToBottom();
        }

        function resetBookingUI() {
            document.getElementById('booking-widget')?.remove();
            document.getElementById('doctor-selection')?.remove();
            interruptArea.classList.add('hidden');
            waitingForResume = false;
            requiredFieldType = null;
            bookingState = {
                selectedDoctor: null, selectedDate: null, selectedSlot: null,
                patientName: '', patientEmail: '', patientPhone: ''
            };
        }

        function showDoctorSelection() {
            loadingIndicator.classList.remove('hidden');
    
            ws.send(JSON.stringify({
                type: "get_doctors",
                hospital_id: hospitalId
            }));
        }

        function appendDoctorsList(doctors) {
            document.getElementById('doctor-selection')?.remove();
            if (!doctors || doctors.length === 0) {
                appendMessage("No clinicians are currently available for online booking. You can call or text Corner Health at 734-484-3600, or try again later.", 'ai');
                return;
            }

            const container = document.createElement('div');
            container.id = 'doctor-selection';
            container.className = "fade-in mb-4 space-y-3";
            container.innerHTML = '<p class="text-sm font-semibold text-slate-700 mb-3">Select a doctor:</p>';
            
            doctors.forEach(doc => {
                const card = document.createElement('div');
                card.className = "doctor-card";
                card.onclick = () => selectDoctor(doc, card);
                
                const avatarUrl = safeImageUrl(doc.profile_pic || '');
                const doctorName = escapeHtml(doc.name);
                const doctorSpecialty = escapeHtml(doc.specialty);
                const initials = escapeHtml(String(doc.name || '').split(/\s+/).map(part => part[0]).join('').slice(0, 2).toUpperCase());
                const avatar = avatarUrl
                    ? `<img src="${escapeHtml(avatarUrl)}" alt="" class="w-full h-full object-cover">`
                    : `<span class="w-full h-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-semibold">${initials}</span>`;
                
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-14 h-14 rounded-full flex-shrink-0 overflow-hidden">
                            ${avatar}
                        </div>
                        <div class="flex flex-col flex-grow">
                            <span class="text-slate-900 font-semibold text-base">${doctorName}</span>
                            <span class="text-xs text-slate-500 font-medium">${doctorSpecialty}</span>
                        </div>
                        <div class="text-indigo-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            
            chatOutput.appendChild(container);
            scrollToBottom();
        }

        function selectDoctor(doctor, cardElement) {
            document.querySelectorAll('.doctor-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            cardElement.classList.add('selected');
            bookingState.selectedDoctor = doctor;
            
            loadingIndicator.classList.remove('hidden');
            ws.send(JSON.stringify({
                type: 'select_doctor',
                doctor_id: doctor.id,
                hospital_id: hospitalId
            }));
        }

        function showCalendar() {
            // Booking is one replaceable surface in the transcript, not a new
            // chat message every time the user moves backward.
            let container = document.getElementById('booking-widget');
            if (!container) {
                container = document.createElement('div');
                container.id = "booking-widget";
                chatOutput.appendChild(container);
            }
            document.querySelectorAll('#booking-widget').forEach(widget => {
                if (widget !== container) widget.remove();
            });
            container.className = "slide-left mb-4";

            const selectedDate = bookingState.selectedDate
                ? new Date(`${bookingState.selectedDate}T00:00:00`)
                : new Date();
            currentCalendarMonth = selectedDate.getMonth();
            currentCalendarYear = selectedDate.getFullYear();
            
            container.innerHTML = `
                <div class="calendar-container">
                    <div class="calendar-header">
                        <h3 class="text-base font-semibold text-slate-800">Select Date</h3>
                        <div class="flex items-center gap-2">
                            <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                                </svg>
                            </button>
                            <span class="text-sm font-medium text-slate-700 min-w-[120px] text-center" id="calendar-month-year"></span>
                            <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="calendar-grid mb-3">
                        <div class="text-center text-xs font-semibold text-slate-500 py-2">Su</div>
                        <div class="text-center text-xs font-semibold text-slate-500 py-2">Mo</div>
                        <div class="text-center text-xs font-semibold text-slate-500 py-2">Tu</div>
                        <div class="text-center text-xs font-semibold text-slate-500 py-2">We</div>
                        <div class="text-center text-xs font-semibold text-slate-500 py-2">Th</div>
                        <div class="text-center text-xs font-semibold text-slate-500 py-2">Fr</div>
                        <div class="text-center text-xs font-semibold text-slate-500 py-2">Sa</div>
                    </div>
                    <div class="calendar-grid" id="calendar-days"></div>
                </div>
            `;
            
            scrollToBottom();
            
            renderCalendar(currentCalendarMonth, currentCalendarYear);
        }

        let currentCalendarMonth = new Date().getMonth();
        let currentCalendarYear = new Date().getFullYear();

        function renderCalendar(month, year) {
            const daysContainer = document.getElementById('calendar-days');
            const monthYearLabel = document.getElementById('calendar-month-year');
            
            if (!daysContainer || !monthYearLabel) return;
            
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            
            monthYearLabel.textContent = `${monthNames[month]} ${year}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            
            daysContainer.innerHTML = '';
            
            // Empty cells for days before month starts
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                daysContainer.appendChild(emptyDay);
            }
            
            // Days of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayDate = new Date(year, month, day);
                const isPast = dayDate < today.setHours(0, 0, 0, 0);
                const isToday = dayDate.toDateString() === new Date().toDateString();
                
                const dayElement = document.createElement('div');
                dayElement.className = `calendar-day ${isPast ? 'disabled' : ''} ${isToday ? 'today' : ''}`;
                dayElement.textContent = day;
                
                if (!isPast) {
                    dayElement.onclick = () => selectDate(year, month, day, dayElement);
                }
                
                daysContainer.appendChild(dayElement);
            }
        }

        function changeMonth(delta) {
            currentCalendarMonth += delta;
            
            if (currentCalendarMonth > 11) {
                currentCalendarMonth = 0;
                currentCalendarYear++;
            } else if (currentCalendarMonth < 0) {
                currentCalendarMonth = 11;
                currentCalendarYear--;
            }
            
            // Don't allow going to past months
            const today = new Date();
            if (currentCalendarYear < today.getFullYear() || 
                (currentCalendarYear === today.getFullYear() && currentCalendarMonth < today.getMonth())) {
                currentCalendarMonth = today.getMonth();
                currentCalendarYear = today.getFullYear();
                return;
            }
            
            renderCalendar(currentCalendarMonth, currentCalendarYear);
        }

        function selectDate(year, month, day, element) {
            document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            
            bookingState.selectedDate = [year, String(month + 1).padStart(2, '0'), String(day).padStart(2, '0')].join('-');
            
            setTimeout(() => {
                loadingIndicator.classList.remove('hidden');
                ws.send(JSON.stringify({
                    type: "get_availability",
                    doctor_id: bookingState.selectedDoctor.id,
                    date: bookingState.selectedDate,
                    duration_minutes: 30
                }));
            }, 300);
        }

        function showTimeSlots(slots) {
            loadingIndicator.classList.add('hidden');
            
            const widget = document.getElementById('booking-widget');
            if (!widget) return;
            
            if (!slots || slots.length === 0) {
                widget.innerHTML = `
                    <div class="calendar-container slide-right">
                        <div class="flex items-center justify-between mb-4">
                            <button onclick="showCalendar()" class="p-2 hover:bg-slate-100 rounded-lg transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                                </svg>
                            </button>
                            <h3 class="text-base font-semibold text-slate-800">Select Time</h3>
                            <div class="w-9"></div>
                        </div>
                        <div class="text-center py-8 text-sm text-slate-600">
                            No available slots for this date. Please select another date.
                        </div>
                    </div>
                `;
                return;
            }
            
            const formattedDate = new Date(`${bookingState.selectedDate}T00:00:00`).toLocaleDateString('en-US', {
                weekday: 'long', 
                month: 'long', 
                day: 'numeric',
                year: 'numeric'
            });
            
            widget.innerHTML = `
                <div class="calendar-container slide-right">
                    <div class="flex items-center justify-between mb-4">
                        <button onclick="showCalendar()" class="p-2 hover:bg-slate-100 rounded-lg transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                        </button>
                        <h3 class="text-base font-semibold text-slate-800">Select Time</h3>
                        <div class="w-9"></div>
                    </div>
                    <p class="text-xs text-slate-600 mb-4">${formattedDate}</p>
                    <div class="grid grid-cols-3 gap-2" id="time-slots-grid"></div>
                </div>
            `;
            
            const grid = widget.querySelector('#time-slots-grid');
            slots.forEach(slot => {
                const slotDiv = document.createElement('div');
                slotDiv.className = 'time-slot';
                slotDiv.textContent = slot.display;
                slotDiv.dataset.start = slot.start;
                slotDiv.dataset.end = slot.end;
                slotDiv.onclick = () => selectTimeSlot(slot, slotDiv);
                grid.appendChild(slotDiv);
            });
            
            scrollToBottom();
        }

        function showAvailabilityError(message) {
            loadingIndicator.classList.add('hidden');
            const widget = document.getElementById('booking-widget');
            if (!widget) return;
            widget.innerHTML = `
                <div class="calendar-container slide-right">
                    <div class="flex items-center justify-between mb-4">
                        <button onclick="showCalendar()" class="p-2 hover:bg-slate-100 rounded-lg transition" aria-label="Choose another date">&larr;</button>
                        <h3 class="text-base font-semibold text-slate-800">Calendar unavailable</h3>
                        <div class="w-9"></div>
                    </div>
                    <p class="text-sm text-slate-600 mb-4" id="availability-error-text"></p>
                    <button onclick="showCalendar()" class="w-full px-4 py-2 border border-indigo-300 text-indigo-700 text-sm font-semibold rounded-lg hover:bg-indigo-50 transition">Choose another date</button>
                </div>`;
            document.getElementById('availability-error-text').textContent = message;
            scrollToBottom();
        }

        function selectTimeSlot(slot, slotElement) {
            document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
            slotElement.classList.add('selected');
            bookingState.selectedSlot = slot;
            
            setTimeout(() => showBookingConfirmation(), 300);
        }

        function showBookingConfirmation() {
            const widget = document.getElementById('booking-widget');
            if (!widget) return;
            
            const formattedDate = new Date(`${bookingState.selectedDate}T00:00:00`).toLocaleDateString('en-US', {
                weekday: 'long', 
                month: 'long', 
                day: 'numeric',
                year: 'numeric'
            });
            const doctorName = escapeHtml(bookingState.selectedDoctor.name);
            const doctorSpecialty = escapeHtml(bookingState.selectedDoctor.specialty);
            const slotDisplay = escapeHtml(bookingState.selectedSlot.display);
            
            widget.innerHTML = `
                <div class="calendar-container slide-right">
                    <div class="flex items-center justify-between mb-4">
                        <button onclick="showTimeSlots(null)" class="p-2 hover:bg-slate-100 rounded-lg transition" id="back-to-slots">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                        </button>
                        <h3 class="text-base font-semibold text-slate-800">Confirm Booking</h3>
                        <div class="w-9"></div>
                    </div>
                    
                    <div class="bg-slate-50 p-3 rounded-lg mb-4 space-y-1 text-xs">
                        <p><span class="font-semibold text-slate-700">Clinician:</span> ${doctorName}</p>
                        <p><span class="font-semibold text-slate-700">Specialty:</span> ${doctorSpecialty}</p>
                        <p><span class="font-semibold text-slate-700">Date:</span> ${formattedDate}</p>
                        <p><span class="font-semibold text-slate-700">Time:</span> ${slotDisplay}</p>
                    </div>
                    
                    <div id="booking-error" class="hidden bg-red-50 border border-red-200 rounded-lg p-3 mb-4">
                        <p class="text-sm text-red-800" id="booking-error-message"></p>
                    </div>
                    
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Additional Notes (Optional)</label>
                            <textarea id="booking-notes" 
                                      rows="2"
                                      class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                      placeholder="Any specific concerns or requests..."></textarea>
                        </div>
                        <button onclick="confirmBooking()" id="confirm-booking-btn"
                                class="w-full px-4 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition shadow-lg">
                            Confirm Appointment
                        </button>
                    </div>
                </div>
            `;
            
            // Add back button handler for time slots
            setTimeout(() => {
                const backBtn = document.getElementById('back-to-slots');
                if (backBtn) {
                    backBtn.onclick = () => {
                        loadingIndicator.classList.remove('hidden');
                        ws.send(JSON.stringify({
                            type: "get_availability",
                            doctor_id: bookingState.selectedDoctor.id,
                            date: bookingState.selectedDate,
                            duration_minutes: 30
                        }));
                    };
                }
            }, 100);
            
            scrollToBottom();
        }

        function confirmBooking() {
            const notesInput = document.getElementById('booking-notes');
            const additionalNotes = notesInput ? notesInput.value : '';
            
            loadingIndicator.classList.remove('hidden');
            
            const bookingPayload = {
                type: "confirm_booking",
                booking_data: {
                    doctor_id: bookingState.selectedDoctor.id,
                    patient_name: bookingState.patientName,
                    patient_email: bookingState.patientEmail,
                    patient_phone: bookingState.patientPhone,
                    start_time: bookingState.selectedSlot.start,
                    end_time: bookingState.selectedSlot.end,
                    notes: additionalNotes
                }
            };
            
            ws.send(JSON.stringify(bookingPayload));
        }

        function connectWebSocket() {
            if (ws) ws.close();
            ws = new WebSocket(WS_URL);
            
            ws.onopen = () => setStatus(true);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                //console.log('WebSocket message received:', data);
                
                if (data.type === 'response') {
                    appendMessage(data.text, 'ai');
                    appendSuggestions(data.suggestions);
                    appendEmergencyContacts(data.emergency_contacts);
                    loadingIndicator.classList.add('hidden');
                    if (data.booking_cancelled) resetBookingUI();
                    
                } else if (data.type === 'show_doctor_selection') {
                    //console.log('Showing doctor selection');
                    
                    if (data.patient_info) {
                        bookingState.patientName = data.patient_info.name || '';
                        bookingState.patientEmail = data.patient_info.email || '';
                        bookingState.patientPhone = data.patient_info.phone || '';
                    }
                    
                    showDoctorSelection();
                    
                } else if (data.type === 'doctors_list') {
                    loadingIndicator.classList.add('hidden');
                    //console.log('Received doctors list:', data.doctors);
                    appendDoctorsList(data.doctors);

                } else if (data.type === 'show_calendar') {
                    loadingIndicator.classList.add('hidden');
                    if (bookingState.selectedDoctor) showCalendar();

                } else if (data.type === 'show_assessment') {
                    loadingIndicator.classList.add('hidden');
                    appendAssessmentAction(data.url || '/assessment');
                    
                } else if (data.type === 'availability_response') {
                    showTimeSlots(data.slots);

                } else if (data.type === 'availability_error') {
                    showAvailabilityError(data.message);
                    
                } else if (data.type === 'booking_result') {
                    loadingIndicator.classList.add('hidden');
                    
                    if (data.success) {
                        appendMessage(`${data.message}`, 'ai');
                        
                        // Remove booking widget
                        const widget = document.getElementById('booking-widget');
                        if (widget) widget.remove();
                        document.getElementById('doctor-selection')?.remove();
                        
                        bookingState = {
                            selectedDoctor: null,
                            selectedDate: null,
                            selectedSlot: null,
                            patientName: '',
                            patientEmail: '',
                            patientPhone: ''
                        };
                    } else {
                        appendMessage(`Booking failed: ${data.message}`, 'ai');
                    }
                    
                } else if (data.type === 'interrupt') {
                    loadingIndicator.classList.add('hidden');
                    requiredFieldType = data.field;
                    waitingForResume = true;
                    interruptRequest.textContent = data.request;
                    interruptArea.classList.remove('hidden');
                    genericInterruptControls.classList.toggle('hidden', data.field === 'contact_details' || data.field === 'unsafe_booking_acknowledgement');
                    contactInterruptControls.classList.toggle('hidden', data.field !== 'contact_details');
                    safetyInterruptControls.classList.toggle('hidden', data.field !== 'unsafe_booking_acknowledgement');
                    if (data.field === 'contact_details') {
                        document.getElementById('contact-full-name').focus();
                    } else if (data.field !== 'unsafe_booking_acknowledgement') {
                        interruptInput.focus();
                    }
                    
                } else if (data.type === 'end') {
                    loadingIndicator.classList.add('hidden');
                    
                } else if (data.type === 'error') {
                    loadingIndicator.classList.add('hidden');
                    appendMessage(`Error: ${data.message}`, 'ai');
                }
            };
            
            ws.onclose = () => {
                setStatus(false);
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleResume() {
            const val = interruptInput.value.trim();
            interruptError.classList.add('hidden');
            interruptInput.classList.remove('input-error');
            
            if (!val) {
                interruptError.textContent = 'This field is required';
                interruptError.classList.remove('hidden');
                interruptInput.classList.add('input-error');
                return;
            }
            
            // Validate email
            if (requiredFieldType === 'user_email') {
                if (!validateEmail(val)) {
                    interruptError.textContent = 'Please enter a valid email address';
                    interruptError.classList.remove('hidden');
                    interruptInput.classList.add('input-error');
                    return;
                }
                bookingState.patientEmail = val;
            }

            if (requiredFieldType === 'user_age') {
                const age = Number(val);
                if (!Number.isInteger(age) || age < 1 || age > 120) {
                    interruptError.textContent = 'Please enter a valid age';
                    interruptError.classList.remove('hidden');
                    interruptInput.classList.add('input-error');
                    return;
                }
            }
            
            // Validate phone
            if (requiredFieldType === 'user_phonenumber') {
                if (!validatePhone(val)) {
                    interruptError.textContent = 'Please enter a valid phone number';
                    interruptError.classList.remove('hidden');
                    interruptInput.classList.add('input-error');
                    return;
                }
                bookingState.patientPhone = val;
            }
            
            // Store patient names
            if (requiredFieldType === 'user_Fname' || requiredFieldType === 'user_Lname') {
                if (requiredFieldType === 'user_Fname') {
                    bookingState.patientName = val;
                } else {
                    bookingState.patientName += ' ' + val;
                }
            }
            
            ws.send(JSON.stringify({ 
                type: "resume", 
                resume_value: { [requiredFieldType]: val } 
            }));
            
            appendMessage(val, 'user');
            
            interruptInput.value = '';
            interruptArea.classList.add('hidden');
            waitingForResume = false;
            loadingIndicator.classList.remove('hidden');
        }

        function handleContactDetails(event) {
            event.preventDefault();
            const fullName = document.getElementById('contact-full-name').value.trim().replace(/\s+/g, ' ');
            const phone = document.getElementById('contact-phone').value.trim();
            const email = document.getElementById('contact-email').value.trim();
            const consent = document.getElementById('contact-consent').checked;
            const error = document.getElementById('contact-error');
            error.classList.add('hidden');

            if (fullName.split(' ').length < 2) {
                error.textContent = 'Enter both a first name and surname.';
            } else if (!validatePhone(phone)) {
                error.textContent = 'Enter a valid number with country code, such as +1 734 555 0123.';
            } else if (!validateEmail(email)) {
                error.textContent = 'Enter a valid email address.';
            } else {
                const normalizedPhone = normalizePhone(phone);
                bookingState.patientName = fullName;
                bookingState.patientPhone = normalizedPhone;
                bookingState.patientEmail = email;
                ws.send(JSON.stringify({
                    type: 'resume',
                    resume_value: {
                        full_name: fullName,
                        phone: normalizedPhone,
                        email,
                        sms_call_consent: consent
                    }
                }));
                appendMessage(`Contact details provided for ${fullName}.`, 'user');
                interruptArea.classList.add('hidden');
                waitingForResume = false;
                loadingIndicator.classList.remove('hidden');
                return;
            }
            error.classList.remove('hidden');
        }

        function resumeSafetyGuidance(continueBooking) {
            if (!continueBooking) {
                ws.send(JSON.stringify({ type: 'cancel_booking' }));
                appendMessage('Stop booking.', 'user');
                resetBookingUI();
                loadingIndicator.classList.remove('hidden');
                return;
            }
            ws.send(JSON.stringify({
                type: 'resume',
                resume_value: { unsafe_booking_acknowledgement: continueBooking }
            }));
            appendMessage(continueBooking ? 'I understand. Continue booking.' : 'Stop booking.', 'user');
            interruptArea.classList.add('hidden');
            waitingForResume = false;
            loadingIndicator.classList.remove('hidden');
        }

        function sendMessage() {
            const msg = userInput.value.trim();
            if (!msg) return;

            const cancelsBooking = /\b(?:(?:i(?:'m| am)?\s+)?not\s+(?:interested\s+in\s+)?(?:booking|scheduling)|(?:i\s+)?(?:do not|don't|dont|no longer|never)\s+(?:(?:want|need|plan|intend)\s+to\s+)?(?:book|schedule|continue(?:\s+booking)?)|(?:i(?:'m| am)?\s+)?not\s+(?:interested\s+in\s+)?(?:seeing|meeting|talking\s+to)\s+(?:a|the)\s+(?:doctor|therapist|counselor|clinician)|(?:i\s+)?(?:do not|don't|dont)\s+(?:want|need)\s+(?:an?\s+)?(?:appointment|session)|(?:no|not)\s+(?:appointment|booking)|(?:stop|cancel)\s+(?:the\s+)?booking)\b/i.test(msg);
            if (waitingForResume && cancelsBooking) {
                ws.send(JSON.stringify({ type: 'cancel_booking' }));
                appendMessage(msg, 'user');
                userInput.value = '';
                resetBookingUI();
                loadingIndicator.classList.remove('hidden');
                return;
            }
            if (waitingForResume) return handleResume();
            
            ws.send(JSON.stringify({ 
                query: msg,
                hospital_id: hospitalId 
            }));
            
            appendMessage(msg, 'user');
            userInput.value = '';
            loadingIndicator.classList.remove('hidden');
        }

        async function loadPublicConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                hospitalId = config.default_hospital_id;
            } catch (error) {
                console.error('Failed to load config', error);
            }
        }

        window.onload = async () => {
            await loadPublicConfig();
            connectWebSocket();
        };
    </script>
</body>
</html>
