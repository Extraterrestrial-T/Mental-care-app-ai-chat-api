substitutions:
  _REGION: europe-west4
  _REPOSITORY: care-images
  _IMAGE_NAME: vllm-qwen3-gptq-cu128-compat
  _TAG: v0.9.1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}
      - --file=Dockerfile.vllm091-cu128-compat
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
