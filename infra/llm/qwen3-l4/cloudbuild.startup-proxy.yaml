substitutions:
  _REGION: europe-west4
  _REPOSITORY: care-images
  _IMAGE_NAME: vllm-qwen3-startup-proxy
  _TAG: v0.8.5-cu124

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}
      - --file=Dockerfile.startup-proxy
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
