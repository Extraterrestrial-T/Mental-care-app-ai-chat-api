# Builds a Gemma 4-capable vLLM image for Cloud Run's NVIDIA L4 GPU.
# The source commit is pinned because vLLM's published Gemma 4 image is CUDA 12.9,
# which cannot initialize against Cloud Run L4's 535-series driver.
substitutions:
  _REGION: europe-west4
  _REPOSITORY: care-images
  _IMAGE_NAME: vllm-gemma4-cu124
  _TAG: 9b4e839
  _VLLM_COMMIT: 9b4e83934

steps:
  - name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -ceu
      - |
        git clone https://github.com/vllm-project/vllm.git vllm
        cd vllm
        git checkout "${_VLLM_COMMIT}"
        test "$(git rev-parse --short=9 HEAD)" = "${_VLLM_COMMIT}"

  # The pinned vLLM Dockerfile unconditionally builds DeepEP for CUDA 13-only
  # architectures. That optional expert-parallel extension is not used by this
  # single-L4 deployment and cannot compile against the CUDA 12.4 PyTorch build.
  - name: gcr.io/cloud-builders/git
    dir: vllm
    entrypoint: bash
    args:
      - -ceu
      - |
        awk '
          /COPY --from=extensions-build \/tmp\/ep_kernels_workspace\/dist/ {
            print "RUN mkdir -p /tmp/ep_kernels_workspace/dist"
            next
          }
          /^RUN --mount=type=bind,from=build,src=\/tmp\/ep_kernels_workspace\/dist/ {
            print "RUN true"
            skip = 1
            next
          }
          skip {
            if ($0 ~ /\\$/) next
            skip = 0
            next
          }
          { print }
        ' docker/Dockerfile > docker/Dockerfile.cu124
        test "$(grep -c 'COPY --from=extensions-build' docker/Dockerfile.cu124)" = 0
        test "$(grep -c 'from=build,src=/tmp/ep_kernels_workspace/dist' docker/Dockerfile.cu124)" = 0

  - name: gcr.io/cloud-builders/docker
    dir: vllm
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file=docker/Dockerfile.cu124
      - --target=vllm-openai
      - --build-arg=CUDA_VERSION=12.4.1
      - --build-arg=torch_cuda_arch_list=8.9
      - --build-arg=VLLM_USE_PRECOMPILED=0
      - --build-arg=max_jobs=4
      - --build-arg=nvcc_threads=1
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}

options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
