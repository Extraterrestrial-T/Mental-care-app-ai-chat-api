name: Build and deploy API to VM

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-vm-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  VM_NAME: ${{ vars.VM_NAME }}
  VM_ZONE: ${{ vars.VM_ZONE }}
  VM_DEPLOY_DIR: ${{ vars.VM_DEPLOY_DIR }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build and push application image
        id: image
        env:
          IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/mental-care-app
        run: |
          docker build \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:main" \
            .
          docker run --rm --entrypoint python "${IMAGE}:${GITHUB_SHA}" \
            -m unittest discover -s tests -v
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:main"
          echo "reference=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare deployment staging directory
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="mkdir -p ~/carecoordinator-deploy"

      - name: Copy deployment configuration to the VM
        run: |
          gcloud compute scp \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --quiet \
            deploy/docker-compose.production.yml \
            deploy/Caddyfile \
            deploy/carecoordinator-calendar-health.service \
            deploy/carecoordinator-calendar-health.timer \
            "${VM_NAME}:~/carecoordinator-deploy/"

      - name: Detect RAG source changes
        id: rag
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "${GITHUB_SHA}" -- \
            app/agent/corpus.txt app/agent/build_rag_index.py deploy/rebuild_rag_index.py; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll out image and maintenance services
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          REBUILD_RAG: ${{ steps.rag.outputs.rebuild }}
        run: |
          REMOTE_COMMAND=$(cat <<EOF
          set -euo pipefail
          if ! sudo -n true; then
            echo 'Deployment identity needs Compute OS Admin Login (passwordless sudo).' >&2
            exit 1
          fi
          sudo -n install -d -m 0755 '${VM_DEPLOY_DIR}'
          sudo -n install -m 0644 ~/carecoordinator-deploy/docker-compose.production.yml '${VM_DEPLOY_DIR}/docker-compose.production.yml'
          sudo -n install -m 0644 ~/carecoordinator-deploy/Caddyfile '${VM_DEPLOY_DIR}/Caddyfile'
          sudo -n install -m 0644 ~/carecoordinator-deploy/carecoordinator-calendar-health.service /etc/systemd/system/carecoordinator-calendar-health.service
          sudo -n install -m 0644 ~/carecoordinator-deploy/carecoordinator-calendar-health.timer /etc/systemd/system/carecoordinator-calendar-health.timer
          cd '${VM_DEPLOY_DIR}'

          test -s .env
          test -s secrets/firebase-service-account.json
          test -s secrets/google-oauth-client.json
          PREVIOUS_IMAGE="\$(sed -n 's/^APP_IMAGE=//p' .release.env 2>/dev/null || true)"
          printf '%s' '${IMAGE}' | grep -q '^${GAR_LOCATION}-docker.pkg.dev/'

          gcloud auth print-access-token | sudo -n docker login \
            -u oauth2accesstoken --password-stdin 'https://${GAR_LOCATION}-docker.pkg.dev'
          sudo -n docker image prune -af
          CANDIDATE_ENV=/tmp/carecoordinator-release.env
          printf 'APP_IMAGE=%s\\n' '${IMAGE}' | sudo -n tee "\$CANDIDATE_ENV" >/dev/null
          sudo -n docker compose --env-file .env --env-file "\$CANDIDATE_ENV" config --quiet
          sudo -n docker compose --env-file .env --env-file "\$CANDIDATE_ENV" pull app rag-indexer calendar-health

          if [ '${REBUILD_RAG}' = 'true' ] || \
             ! sudo -n docker compose --env-file .env --env-file "\$CANDIDATE_ENV" run --rm --no-deps app \
               python -c "from pathlib import Path; raise SystemExit(0 if Path('/data/rag-index/index.faiss').is_file() else 1)"; then
            sudo -n docker compose --env-file .env --env-file "\$CANDIDATE_ENV" --profile index run --rm rag-indexer
          fi

          printf 'APP_IMAGE=%s\\n' '${IMAGE}' | sudo -n tee .release.env >/dev/null
          if ! sudo -n docker compose --env-file .env --env-file .release.env up -d --remove-orphans --wait; then
            echo 'New revision failed health checks; rolling back.' >&2
            if [ -n "\$PREVIOUS_IMAGE" ]; then
              printf 'APP_IMAGE=%s\\n' "\$PREVIOUS_IMAGE" | sudo -n tee .release.env >/dev/null
              sudo -n docker compose --env-file .env --env-file .release.env pull app
              sudo -n docker compose --env-file .env --env-file .release.env up -d --remove-orphans --wait
            fi
            exit 1
          fi
          sudo -n rm -f "\$CANDIDATE_ENV"
          sudo -n docker compose --env-file .env --env-file .release.env exec -T caddy \
            caddy reload --config /etc/caddy/Caddyfile

          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now carecoordinator-calendar-health.timer
          sudo -n systemctl start carecoordinator-calendar-health.service
          sudo -n systemctl is-enabled --quiet carecoordinator-calendar-health.timer
          sudo -n systemctl is-active --quiet carecoordinator-calendar-health.timer
          sudo -n docker image prune -af
          sudo -n docker compose --env-file .env --env-file .release.env ps
          EOF
          )
          gcloud compute ssh "$VM_NAME" \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="$REMOTE_COMMAND"
